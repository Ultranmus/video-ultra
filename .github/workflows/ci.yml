# The same checks as `pnpm verify`. Manual-only until v0.1 (owner, 2026-10-17): run it from the
# Actions tab ("Run workflow"). Before v0.1, restore the push/pull_request triggers:
#   on:
#     push:
#       branches: [main]
#     pull_request:
name: CI

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint and formatting
        run: pnpm lint && pnpm format:check
      - name: Build
        run: pnpm build
      - name: Types
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
