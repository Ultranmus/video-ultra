# The same checks as `pnpm verify`, plus the packages as npm will see them (pack-check).
# Browser checks (scripts/*-check.ts) need real GPUs, Safari and test media: they run locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Shaders up to date
        run: pnpm shaders --check
      - name: Lint and formatting
        run: pnpm lint && pnpm format:check
      - name: Build
        run: pnpm build
      - name: Types
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Packages (publint, types, sizes, fresh install, SSR)
        run: node scripts/pack-check.ts
